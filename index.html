<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motorsport Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#080a0f;
    --card:#10141c;
    --card2:#141923;
    --accent:#35c8ff;
    --red:#ff365d;
    --text:#f5f7fb;
    --muted:#8e98a8;
    --line:rgba(255,255,255,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        var(--bg);
    background-size:40px 40px;
    color:var(--text);
    font-family:Inter,sans-serif;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 10%,rgba(53,200,255,.08),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(255,54,93,.06),transparent 25%);
}

button{
    font-family:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(16px);
    background:rgba(8,10,15,.88);
    border-bottom:1px solid var(--line);
}

.header-inner{
    max-width:1450px;
    margin:auto;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:Orbitron,sans-serif;
    font-weight:800;
    border-radius:10px;
    box-shadow:0 0 22px rgba(53,200,255,.12);
}

.brand h1{
    font-family:Orbitron,sans-serif;
    font-size:18px;
    letter-spacing:1px;
}

.brand span{
    color:var(--muted);
    font-size:10px;
    letter-spacing:1.5px;
}

.nav{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav button{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    letter-spacing:.8px;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:#fff;
    border-color:var(--accent);
    background:rgba(53,200,255,.08);
}

main{
    max-width:1450px;
    margin:auto;
    padding:55px 28px 80px;
}

.hero{
    display:grid;
    grid-template-columns:1.4fr .6fr;
    gap:25px;
    margin-bottom:30px;
}

.hero-main{
    padding:42px;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(135deg,rgba(53,200,255,.05),rgba(255,54,93,.03));
}

.hero-tag{
    color:var(--accent);
    font-family:Orbitron,sans-serif;
    font-size:11px;
    letter-spacing:2px;
    font-weight:800;
    margin-bottom:18px;
}

.hero h2{
    font-family:Orbitron,sans-serif;
    font-size:clamp(38px,6vw,76px);
    line-height:.98;
    letter-spacing:-2px;
}

.hero h2 span{
    color:var(--accent);
}

.hero p{
    color:var(--muted);
    max-width:700px;
    margin-top:22px;
    line-height:1.7;
}

.hero-side{
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--card);
    padding:28px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.current-series{
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    font-weight:800;
}

.series-big{
    font-family:Orbitron,sans-serif;
    font-size:42px;
    margin-top:8px;
}

.update{
    margin-top:25px;
    width:100%;
    border:1px solid var(--accent);
    color:#fff;
    background:rgba(53,200,255,.08);
    border-radius:10px;
    padding:13px 16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.update:hover{
    background:var(--accent);
    color:#061018;
}

.update:disabled{
    opacity:.6;
    cursor:wait;
}

.sync-time{
    margin-top:10px;
    color:var(--muted);
    font-size:9px;
    text-align:center;
    letter-spacing:.5px;
}

.series-page{
    display:none;
}

.series-page.active{
    display:block;
}

.grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    overflow:hidden;
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.card-title h3{
    font-family:Orbitron,sans-serif;
    font-size:12px;
    letter-spacing:1.4px;
}

.card-title span{
    color:var(--muted);
    font-size:10px;
}

.sessions-card{
    grid-column:1/-1;
}

.session-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.session-box{
    background:var(--card2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    min-height:180px;
}

.session-label{
    font-family:Orbitron,sans-serif;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:15px;
}

.session-result{
    display:grid;
    grid-template-columns:30px 1fr auto;
    align-items:center;
    gap:6px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
}

.session-result:last-child{
    border-bottom:none;
}

.session-pos{
    color:var(--accent);
    font-size:10px;
    font-weight:800;
}

.session-driver{
    font-size:11px;
    font-weight:700;
}

.session-time{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
}

.session-upcoming{
    opacity:.75;
}

.pole-box{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.pole-box .session-driver{
    font-family:Orbitron,sans-serif;
    font-size:16px;
    margin-bottom:6px;
}

.last-race{
    grid-column:span 4;
}

.next-event{
    grid-column:span 4;
}

.championship{
    grid-column:span 4;
}

.results-card{
    grid-column:span 6;
}

.standings-card{
    grid-column:span 6;
}

.stat{
    margin-bottom:18px;
}

.stat-label{
    color:var(--muted);
    font-size:10px;
    letter-spacing:1.5px;
    font-weight:800;
}

.stat-value{
    font-family:Orbitron,sans-serif;
    font-size:24px;
    margin-top:6px;
}

.event-name{
    font-family:Orbitron,sans-serif;
    font-size:24px;
    line-height:1.2;
    margin-bottom:10px;
}

.event-info{
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

.podium{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:20px;
}

.podium-item{
    background:var(--card2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 9px;
    text-align:center;
}

.podium-pos{
    font-family:Orbitron,sans-serif;
    color:var(--accent);
    font-size:11px;
    font-weight:800;
}

.podium-name{
    font-size:11px;
    font-weight:800;
    margin-top:6px;
}

.podium-team{
    color:var(--muted);
    font-size:9px;
    margin-top:4px;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:left;
    padding:9px 7px;
    border-bottom:1px solid var(--line);
}

.table td{
    padding:11px 7px;
    font-size:11px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.table tr:last-child td{
    border-bottom:none;
}

.pos{
    color:var(--accent);
    font-family:Orbitron,sans-serif;
    font-weight:800;
}

.points{
    font-weight:800;
}

.fastest{
    grid-column:span 4;
}

.secondary{
    grid-column:span 4;
}

.about{
    grid-column:span 4;
}

.highlight{
    font-family:Orbitron,sans-serif;
    color:var(--accent);
    font-size:28px;
}

.muted{
    color:var(--muted);
}

.status{
    display:inline-block;
    margin-top:12px;
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:9px;
    font-weight:800;
    color:var(--muted);
}

.status.live{
    color:var(--accent);
    border-color:rgba(53,200,255,.35);
}

.status.ok{
    color:#62ffad;
    border-color:rgba(98,255,173,.35);
}

.status.error{
    color:var(--red);
    border-color:rgba(255,54,93,.35);
}

.manual-note{
    color:var(--muted);
    font-size:11px;
    line-height:1.7;
}

.data-date{
    color:var(--accent);
    font-family:Orbitron,sans-serif;
    font-size:11px;
    margin-top:10px;
}

footer{
    max-width:1450px;
    margin:auto;
    padding:0 28px 40px;
    color:var(--muted);
    font-size:10px;
    text-align:center;
}

@media(max-width:1100px){

    .hero{
        grid-template-columns:1fr;
    }

    .session-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .last-race,
    .next-event,
    .championship,
    .results-card,
    .standings-card,
    .fastest,
    .secondary,
    .about{
        grid-column:span 6;
    }
}

@media(max-width:700px){

    .header-inner{
        align-items:flex-start;
        flex-direction:column;
    }

    .nav{
        justify-content:flex-start;
    }

    main{
        padding:30px 15px 60px;
    }

    .hero-main{
        padding:28px;
    }

    .hero h2{
        font-size:42px;
    }

    .session-grid{
        grid-template-columns:1fr;
    }

    .last-race,
    .next-event,
    .championship,
    .results-card,
    .standings-card,
    .fastest,
    .secondary,
    .about{
        grid-column:1/-1;
    }

    .podium{
        grid-template-columns:1fr;
    }
}

</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SESSION HTML
========================================================= */

function sessionHTML(label,rows){

    const isUpcoming =
        rows.every(
            row =>
                row[0] === "UPCOMING" ||
                row[0] === "NOT ADDED"
        );

    return `

        <div class="session-box ${isUpcoming ? "session-upcoming" : ""}">

            <div class="session-label">
                ${escapeHTML(label)}
            </div>

            ${rows.map((row,index)=>`

                <div class="session-result">

                    <span class="session-pos">
                        P${index + 1}
                    </span>

                    <span class="session-driver">
                        ${escapeHTML(row[0])}
                    </span>

                    <span class="session-time">
                        ${escapeHTML(row[1])}
                    </span>

                </div>

            `).join("")}

        </div>

    `;

}

/* =========================================================
   RENDER ALL PAGES
========================================================= */

function renderAllSeries(){

    const container =
        document.getElementById("pages");

    if(!container){
        return;
    }

    container.innerHTML =
        Object.keys(seriesData)
            .map(
                key =>
                    buildSeriesPage(key)
            )
            .join("");

}


/* =========================================================
   NAVIGATION
========================================================= */

let currentSeries =
    "f1";


function showSeries(series,button){

    currentSeries =
        series;

    document
        .querySelectorAll(".series-page")
        .forEach(page => {

            page.classList.remove("active");

        });

    const page =
        document.getElementById(series);

    if(page){

        page.classList.add("active");

    }

    document
        .querySelectorAll(".nav button")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    if(button){

        button.classList.add("active");

    }

    const data =
        seriesData[series];

    if(!data){
        return;
    }

    const heroSeries =
        document.getElementById("heroSeries");

    if(heroSeries){

        heroSeries.textContent =
            data.name;

    }

    const updateButton =
        document.getElementById("heroUpdate");

    if(updateButton){

        updateButton.disabled =
            false;

        updateButton.textContent =
            "↻ UPDATE " + data.name;

        updateButton.onclick =
            function(){

                updateSeries(series);

            };

    }

}


/* =========================================================
   MANUAL UPDATE BUTTON
========================================================= */

async function updateSeries(series) {

  const button = document.getElementById("heroUpdate");

  if (!button) {
    return;
  }

  /* =======================================================
     NON-F1 SERIES
  ======================================================= */

  if (series !== "f1") {

    button.textContent = "↻ UPDATING...";
    button.disabled = true;

    await new Promise(resolve =>
      setTimeout(resolve, 400)
    );

    renderAllSeries();

    showSeries(
      series,
      document.querySelector(".nav button.active")
    );

    button.textContent = "✓ UPDATED";

    setTimeout(() => {
      button.textContent =
        "↻ UPDATE " + series.toUpperCase();

      button.disabled = false;
    }, 1500);

    return;
  }


  /* =======================================================
     LIVE F1 UPDATE
  ======================================================= */

  button.textContent = "↻ FETCHING F1...";
  button.disabled = true;

  try {

    const response = await fetch(
      "https://motorsport-tracker-api.aaravboii02.workers.dev/f1",
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "API request failed: " + response.status
      );
    }

    const live = await response.json();

    if (live.error) {
      throw new Error(
        live.message || "Live API error"
      );
    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function driverName(driver) {

      if (!driver) {
        return "—";
      }

      return [
        driver.givenName,
        driver.familyName
      ]
        .filter(Boolean)
        .join(" ");

    }


    function teamName(constructor) {

      return constructor?.name || "—";

    }


    /* =====================================================
       CHAMPIONSHIP STANDINGS
    ===================================================== */

    const standings =
      live.standings?.MRData
        ?.StandingsTable
        ?.StandingsLists?.[0]
        ?.DriverStandings || [];

    if (standings.length) {

      seriesData.f1.championship = {

        leader:
          driverName(
            standings[0].Driver
          ),

        points:
          standings[0].points + " PTS"

      };


      seriesData.f1.standings =
        standings
          .slice(0, 10)
          .map(item => [

            driverName(
              item.Driver
            ),

            teamName(
              item.Constructors?.[0]
            ),

            item.points

          ]);

    }


    /* =====================================================
       LAST RACE
    ===================================================== */

    const races =
      live.results?.MRData
        ?.RaceTable
        ?.Races || [];

    if (races.length) {

      const race =
        races[0];

      const results =
        race.Results || [];


      seriesData.f1.lastRace = {

        name:
          race.raceName ||
          "LATEST RACE",

        info:
          (race.Circuit?.circuitName || "—") +
          "<br>" +
          (race.date || "—"),

        round:
          "ROUND " +
          (race.round || "—"),

        podium:
          results
            .slice(0, 3)
            .map(result => [

              driverName(
                result.Driver
              ),

              teamName(
                result.Constructor
              )

            ])

      };


      /* =================================================
         LAST RACE RESULTS
      ================================================= */

      seriesData.f1.results =
        results
          .slice(0, 5)
          .map(result => [

            driverName(
              result.Driver
            ),

            result.positionText ||
            result.position ||
            "—"

          ]);


      /* =================================================
         LAST RACE WINNER
      ================================================= */

      if (results[0]) {

        seriesData.f1.secondary = {

          label:
            "LAST RACE WINNER",

          title:
            driverName(
              results[0].Driver
            ),

          subtitle:
            teamName(
              results[0].Constructor
            ) +
            " • P1"

        };

      }


      /* =================================================
         FASTEST LAP
      ================================================= */

      let fastest =
        results.find(
          result =>
            String(
              result.FastestLap?.rank
            ) === "1"
        );


      if (!fastest) {

        const withLaps =
          results.filter(
            result =>
              result.FastestLap?.Time?.millis
          );


        withLaps.sort(
          (a, b) =>
            Number(
              a.FastestLap.Time.millis
            ) -
            Number(
              b.FastestLap.Time.millis
            )
        );


        fastest =
          withLaps[0];

      }


      if (
        fastest &&
        fastest.FastestLap
      ) {

        seriesData.f1.fastest = {

          event:
            race.raceName ||
            "LATEST RACE",

          driver:
            driverName(
              fastest.Driver
            ),

          time:
            fastest.FastestLap.Time?.time ||
            "—",

          team:
            teamName(
              fastest.Constructor
            ) +
            " • Lap " +
            (
              fastest.FastestLap.lap ||
              "—"
            )

        };

      }

    }


    /* =====================================================
       QUALIFYING
    ===================================================== */

    const qualifyingRaces =
      live.qualifying?.MRData
        ?.RaceTable
        ?.Races || [];

    if (qualifyingRaces.length) {

      const qualifying =
        qualifyingRaces[0]
          .QualifyingResults || [];


      seriesData.f1.sessions.QUALIFYING =
        qualifying
          .slice(0, 3)
          .map(result => [

            driverName(
              result.Driver
            ),

            result.Q3 ||
            result.Q2 ||
            result.Q1 ||
            "—"

          ]);


      if (qualifying[0]) {

        seriesData.f1.sessions.POLE = {

          driver:
            driverName(
              qualifying[0].Driver
            ),

          time:
            qualifying[0].Q3 ||
            qualifying[0].Q2 ||
            qualifying[0].Q1 ||
            "—"

        };

      }

    }


    /* =====================================================
       NEXT EVENT
    ===================================================== */

    const schedule =
      live.schedule?.MRData
        ?.RaceTable
        ?.Races || [];


    const now =
      new Date();


    const upcoming =
      schedule.filter(race => {

        if (!race.date) {
          return false;
        }

        return new Date(
          race.date + "T23:59:59"
        ) >= now;

      });


    if (upcoming.length) {

      const next =
        upcoming[0];


      seriesData.f1.nextEvent = {

        title:
          "NEXT EVENT",

        name:
          next.raceName ||
          "NEXT RACE",

        info:
          (next.Circuit?.circuitName || "—") +
          "<br>" +
          (next.date || "—") +
          (
            next.time
              ? " • " +
                next.time.slice(0, 5) +
                " UTC"
              : ""
          ),

        round:
          "ROUND " +
          (next.round || "—"),

        status:
          "UPCOMING"

      };

    }


    /* =====================================================
       LAST UPDATED
    ===================================================== */

    seriesData.f1.lastUpdated =
      new Date().toLocaleDateString(
        "en-GB",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );


    /* =====================================================
       REBUILD F1 PAGE
    ===================================================== */

    const oldPage =
      document.getElementById("f1");


    const temp =
      document.createElement("div");


    temp.innerHTML =
      buildSeriesPage("f1");


    const newPage =
      temp.firstElementChild;


    if (
      oldPage &&
      newPage
    ) {

      oldPage.replaceWith(
        newPage
      );

      newPage.classList.add(
        "active"
      );

    }


    /* =====================================================
       SUCCESS
    ===================================================== */

    button.textContent =
      "✓ F1 UPDATED";


    setTimeout(() => {

      button.textContent =
        "↻ UPDATE F1";

      button.disabled =
        false;

    }, 2000);


  } catch (error) {

    console.error(
      "F1 UPDATE ERROR:",
      error
    );


    button.textContent =
      "✕ UPDATE FAILED";


    setTimeout(() => {

      button.textContent =
        "↻ UPDATE F1";

      button.disabled =
        false;

    }, 2500);


    alert(
      "F1 update failed.\n\n" +
      error.message
    );

  }

}

/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        renderAllSeries();

        showSeries(
            "f1",
            document.querySelector(
                ".nav button.active"
            )
        );

    }
);

</script>
